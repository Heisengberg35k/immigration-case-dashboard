<div class="app-shell">
  <aside
    class="sidebar"
    [class.collapsed]="sidebarCollapsed"
  >
    <div class="brand-block">
      <span class="brand-mark">CF</span>
      <div class="brand-copy">
        <h2>CaseFlow</h2>
        <small>Immigration practice system</small>
      </div>
    </div>

    <button
      type="button"
      class="sidebar-toggle"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="!sidebarCollapsed"
      aria-label="Toggle main navigation"
    >
      <span aria-hidden="true">{{ sidebarCollapsed ? '>>' : '<<' }}</span>
    </button>

    <nav class="primary-nav" aria-label="Primary">
      <a routerLink="/dashboard" title="Dashboard">
        <span class="nav-icon" aria-hidden="true">D</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a routerLink="/clients" title="Clients">
        <span class="nav-icon" aria-hidden="true">C</span>
        <span class="nav-label">Clients</span>
      </a>
      <a routerLink="/reports" title="Reports">
        <span class="nav-icon" aria-hidden="true">R</span>
        <span class="nav-label">Reports</span>
      </a>
    </nav>

    <nav
      *ngIf="canViewAuditLog() || canManageUsers()"
      class="secondary-nav"
      aria-label="Administration"
    >
      <span class="nav-section-label">Administration</span>
      <a
        *ngIf="canViewAuditLog()"
        routerLink="/audit-log"
        title="Audit Log"
      >
        <span class="nav-icon" aria-hidden="true">A</span>
        <span class="nav-label">Audit Log</span>
      </a>
      <a
        *ngIf="canManageUsers()"
        routerLink="/users"
        title="Users"
      >
        <span class="nav-icon" aria-hidden="true">U</span>
        <span class="nav-label">Users</span>
      </a>
    </nav>

    <div class="user-box">
      <p>{{ user?.name }}</p>
      <small>{{ user?.role }}</small>
      <button (click)="logout()" title="Logout">
        <span class="logout-full">Logout</span>
        <span class="logout-short">Out</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
