<div class="login-page">
  <div class="login-card">
    <h1>Immigration Case Dashboard</h1>
    <p>Staff login</p>

    <form (ngSubmit)="login()">
      <label>Email</label>
      <input
        type="email"
        name="email"
        [(ngModel)]="email"
        required
      />

      <label>Password</label>
      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      />

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>

      <div class="error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>
    </form>
  </div>
</div>
