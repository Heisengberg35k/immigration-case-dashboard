<div class="case-workspace">
  <aside class="case-section-sidebar" aria-label="Case sections">
    <div class="case-section-title">
      <span>Case Options</span>
      <small>Client workspace</small>
    </div>

    <button
      *ngFor="let section of sections"
      type="button"
      class="case-section-link"
      [class.active]="activeSection === section.id"
      (click)="selectSection(section.id)"
    >
      <span class="case-section-mark">{{ section.mark }}</span>
      <span>{{ section.label }}</span>
    </button>
  </aside>

  <section class="case-section-content">
    <app-case-documents-section
      *ngIf="activeSection === 'documents'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-documents-section>

    <app-case-questionnaires-section
      *ngIf="activeSection === 'questionnaires'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-questionnaires-section>

    <app-case-deadlines-section
      *ngIf="activeSection === 'deadlines'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-deadlines-section>

    <app-case-appointments-section
      *ngIf="activeSection === 'appointments'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-appointments-section>

    <app-case-payments-section
      *ngIf="activeSection === 'payments'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-payments-section>

    <app-case-visa-reminders-section
      *ngIf="activeSection === 'visaReminders'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-visa-reminders-section>

    <app-case-notes-section
      *ngIf="activeSection === 'notes'"
      [profile]="profile"
      [caseId]="caseId"
      (profileChanged)="profileChanged.emit()"
    ></app-case-notes-section>
  </section>
</div>
